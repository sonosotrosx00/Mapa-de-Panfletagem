<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mapa de Panfletagem</title>
  <meta name="description" content="Regiões de panfletagem por dia.">
  <meta name="theme-color" content="#1d3061">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Panfletagem">
  <script>
    try { var t = localStorage.getItem('tema'); if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a href="#/" class="brand" aria-label="Início">
        <img src="img/logo_prefeitura.png" alt="Prefeitura de Belém" class="logo">
        <span class="brand-sep" aria-hidden="true"></span>
        <img src="img/logo_belem_limpa.png" alt="Belém Limpa" class="logo">
      </a>
      <div class="actions">
        <button id="btnInstall" class="btn-install" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16" /></svg>
          Instalar
        </button>
        <div class="theme">
          <button id="btnTheme" class="btn-theme" aria-label="Tema" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <div id="themeMenu" class="menu" hidden role="menu">
            <button role="menuitemradio" data-theme="sistema">Sistema</button>
            <button role="menuitemradio" data-theme="claro">Claro</button>
            <button role="menuitemradio" data-theme="escuro">Escuro</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Mapa ampliado">
    <div class="viewer-bar">
      <button class="vbtn" data-act="close" aria-label="Fechar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <span class="viewer-title" id="viewerTitle"></span>
      <a class="vbtn" id="viewerDl" aria-label="Baixar imagem" download>
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16"/></svg>
      </a>
    </div>
    <div class="viewer-stage" id="viewerStage">
      <img id="viewerImg" alt="" draggable="false">
      <div class="viewer-loading" id="viewerLoading">Carregando…</div>
    </div>
    <div class="viewer-zoom">
      <button class="vbtn" data-act="out" aria-label="Diminuir zoom"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="vbtn" data-act="fit" aria-label="Ajustar à tela"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="vbtn" data-act="in" aria-label="Aumentar zoom"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
  </div>

  <div id="iosSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="iosTitle">
    <div class="sheet-card">
      <h2 id="iosTitle">Instalar no iPhone</h2>
      <ol>
        <li>Toque em <b>Compartilhar</b> no Safari</li>
        <li>Escolha <b>Adicionar à Tela de Início</b></li>
        <li>Toque em <b>Adicionar</b></li>
      </ol>
      <button class="btn btn-primary" data-close>OK</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
